name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  generate-graph:
    name: Generate NuGet Dependency Graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env

      - name: Generate graph
        uses: Tsabo/nugraph-action@v4
        with:
          project-path: ./source/DoorSim.slnx
          job-summary: 'true'
          dotnet-version: '10.0.x'
          hide-empty-graphs: 'true'
          title: ''
          ignore: |
            Microsoft.*
            System.*
          extra-args: |
            DoorSim.Client=--runtime browser-wasm

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Automated Test Report Artifact Upload
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env

      - name: Restore
        working-directory: source
        run: dotnet restore DoorSim.slnx

      - name: Build
        working-directory: source
        run: dotnet build DoorSim.slnx -c Release --no-restore

      - name: Test
        working-directory: source
        run: dotnet test --solution DoorSim.slnx -c Release --no-build

  # Packaging smoke test: catches release-only breakage (publish, archive, .deb, image) on every PR
  # instead of at tag time. Nothing is uploaded or pushed.
  publish-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-arm64
            deb: true
          - rid: win-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env

      - name: Install nfpm
        if: matrix.deb
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Package ${{ matrix.rid }}
        run: scripts/package.sh ${{ matrix.rid }} 0.0.0-ci ${{ matrix.deb && '--deb' || '' }}

  docker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (amd64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
