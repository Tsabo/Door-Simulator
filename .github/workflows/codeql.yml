name: "CodeQL Security Analysis"

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'source/**'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'source/**'
  schedule:
    # Run at 6:00 AM UTC every Monday
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze Code
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up build environment
      uses: ./.github/actions/setup-build-env

    # Initialize CodeQL tools for scanning
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended
        # Optional: Add custom queries
        # queries: ./path/to/local/query, security-extended

    - name: Restore
      working-directory: source
      run: dotnet restore DoorSim.slnx

    - name: Build
      working-directory: source
      run: dotnet build DoorSim.slnx -c Release --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        upload: true
        output: results

    - name: Upload SARIF results as artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: codeql-results-${{ matrix.language }}
        path: results
        retention-days: 90
      continue-on-error: true
