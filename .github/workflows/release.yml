name: Release

# Push a tag like v1.2.3 (or v1.2.3-rc1 for a prerelease) to build every package, publish the
# multi-arch image to GHCR, and create a GitHub Release. Run manually for a dry run: packages are
# uploaded as workflow artifacts, the image is built but not pushed, and no release is created.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp on the dry-run build (no leading v)'
        required: false
        default: '0.0.0-dryrun'

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/doorsim

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "Version: $version"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env

      - name: Build
        working-directory: source
        run: dotnet build DoorSim.slnx -c Release

      - name: Test
        working-directory: source
        run: dotnet test --solution DoorSim.slnx -c Release --no-build

  package:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: ubuntu-latest
          - rid: linux-x64
            os: ubuntu-latest
            deb: true
          - rid: linux-arm64
            os: ubuntu-latest
            deb: true
          # Built on macOS so the apphost gets the ad-hoc code signature Apple Silicon requires.
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env

      - name: Install nfpm
        if: matrix.deb
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.rid }} ${{ needs.version.outputs.version }} ${{ matrix.deb && '--deb' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  docker:
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest only moves for stable releases; prereleases get just their exact version tag.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && needs.version.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ github.ref_type != 'tag' }}

      - uses: docker/build-push-action@v7
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref_type == 'tag'
    needs: [version, package, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Install

            | Platform | Download |
            | --- | --- |
            | Raspberry Pi (64-bit OS) | `doorsim_*_arm64.deb` → `sudo apt install ./doorsim_*_arm64.deb` |
            | Debian / Ubuntu x64 | `doorsim_*_amd64.deb` |
            | Windows x64 | `doorsim-*-win-x64.zip` → unzip, run `DoorSim.exe` |
            | macOS (Apple Silicon) | `doorsim-*-osx-arm64.tar.gz` → see note below |
            | Other Linux | `doorsim-*-linux-{x64,arm64}.tar.gz` |
            | Docker | `docker run -p 5000:5000 -v doorsim-data:/data ${{ env.IMAGE }}:${{ needs.version.outputs.version }}` |

            Then open http://localhost:5000. Wiegand output and GPIO door contacts need a Raspberry Pi;
            on other hosts use OSDP (USB RS-485 adapter) and Modbus relay boards.

            **macOS:** the build is not notarized. After extracting, clear the quarantine flag once:
            `xattr -dr com.apple.quarantine doorsim-*-osx-arm64`, then run `./DoorSim`.
