# nfpm configuration for the DoorSim Debian package (Raspberry Pi OS / Debian / Ubuntu).
# Built by scripts/package.sh, which stages the self-contained publish output at packaging/.stage/app
# and exports VERSION and DEB_ARCH (arm64 | amd64).
name: doorsim
arch: ${DEB_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: misc
priority: optional
maintainer: Jeremy Brown
description: |
  Access-control reader and door simulator.
  Emulates Wiegand and OSDP card readers, door position switches and REX
  buttons against a real access-control panel, with a web UI, REST API and
  MCP server on port 5000.
vendor: DoorSim
homepage: https://github.com/Tsabo/Door-Simulator
license: MIT

# Self-contained .NET still needs the C/C++ runtime and ICU from the OS.
depends:
  - libc6
  - libgcc-s1
  - libstdc++6
  - libicu76 | libicu74 | libicu72 | libicu70
recommends:
  - libgpiod2

contents:
  - src: ./packaging/.stage/app/
    dst: /opt/doorsim
    type: tree

  - src: ./scripts/wait-for-rs485.sh
    dst: /opt/doorsim/wait-for-rs485.sh
    file_info:
      mode: 0755

  - src: ./packaging/doorsim.service
    dst: /usr/lib/systemd/system/doorsim.service

  - src: ./scripts/99-waveshare485.rules
    dst: /usr/lib/udev/rules.d/99-waveshare485.rules

  - src: ./packaging/appsettings.json
    dst: /etc/doorsim/appsettings.json
    type: config|noreplace

  - src: ./scripts/setup-pi.sh
    dst: /usr/share/doorsim/setup-pi.sh
    file_info:
      mode: 0755

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
